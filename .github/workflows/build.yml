name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/assinatura.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/assinatura.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo KEYSTORE_B64 ausente: APK sai com chave temporária e NÃO atualiza por cima."
          fi
      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ComprasLoes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ComprasLoes-apk
          path: ComprasLoes.apk
      - name: Publicar na Release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ComprasLoes.apk \
            --title "Compras LOES (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}." \
            --latest

name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar assinatura
        env:
          # Aceita um segredo único "senha:base64" com qualquer um dos dois nomes,
          # ou os dois segredos separados (KEYSTORE_B64 + KEYSTORE_PASSWORD).
          S1: ${{ secrets.KEYSTORE_B64 }}
          S2: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          B64=""; PASS=""
          for S in "$S1" "$S2"; do
            S=$(printf '%s' "$S" | tr -d ' \r\n')
            [ -z "$S" ] && continue
            if [ "${S#*:}" != "$S" ]; then PASS="${S%%:*}"; B64="${S#*:}"
            elif [ ${#S} -gt 200 ]; then B64="$S"
            else PASS="$S"; fi
          done
          echo "chave: ${#B64} caracteres | senha: ${#PASS} caracteres"
          if [ -z "$B64" ]; then echo "::error::Não achei a chave: cole o conteúdo de SEGREDO_UNICO.txt no segredo KEYSTORE_B64"; exit 1; fi
          if [ -z "$PASS" ]; then echo "::error::Não achei a senha: cole o conteúdo de SEGREDO_UNICO.txt no segredo KEYSTORE_B64"; exit 1; fi
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/assinatura.jks" || { echo "::error::Chave em base64 inválida (copie o arquivo inteiro)"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/assinatura.jks" -storepass "$PASS" -alias compras > /dev/null \
            || { echo "::error::A senha não abre a chave"; exit 1; }
          echo "::add-mask::$PASS"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/assinatura.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -q "CN=Compras LOES" certs.txt || { echo "::error::APK não saiu com a chave fixa"; exit 1; }
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ComprasLoes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ComprasLoes-apk
          path: ComprasLoes.apk
      - name: Publicar na Release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ComprasLoes.apk \
            --title "Compras LOES (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}." \
            --latest

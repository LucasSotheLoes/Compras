name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "KEYSTORE_B64: ${#KEYSTORE_B64} caracteres | KEYSTORE_PASSWORD: ${#KEYSTORE_PASSWORD} caracteres"
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Falta o segredo KEYSTORE_B64"; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Falta o segredo KEYSTORE_PASSWORD (confira o nome exato)"; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/assinatura.jks" || { echo "::error::KEYSTORE_B64 não é um base64 válido (copie o arquivo inteiro)"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/assinatura.jks" -storepass "$KEYSTORE_PASSWORD" -alias compras > /dev/null \
            || { echo "::error::A senha KEYSTORE_PASSWORD não abre a chave (confira se colou sem espaços)"; exit 1; }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/assinatura.jks" >> "$GITHUB_ENV"
      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Conferir assinatura
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -q "CN=Compras LOES" certs.txt || { echo "::error::APK não saiu com a chave fixa"; exit 1; }
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ComprasLoes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ComprasLoes-apk
          path: ComprasLoes.apk
      - name: Publicar na Release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ComprasLoes.apk \
            --title "Compras LOES (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}." \
            --latest
